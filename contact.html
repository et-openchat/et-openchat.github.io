<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ | 地震速報/気象情報/交通情報　共有オープンチャット</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="contact.css">
</head>
<body>

  <header>
    <div class="header-container">
      <div class="site-title">地震速報/気象情報/交通情報　共有オープンチャット</div>
      <nav>
        <ul>
          <li><a href="index">ホーム</a></li>
          <li><a href="contact">お問い合わせ</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main style="max-width: 650px;">
    <h1 class="page-title">お問い合わせ</h1>
    <p class="lead-text">情報提供範囲に関するお問い合わせ、その他ご質問やご要望は以下のフォームより送信してください。</p>

    <div id="success-message">
      <h2>送信が完了しました</h2>
      <p style="font-weight: normal; margin-top: 10px;">お問い合わせを受け付けました。ご協力ありがとうございました。</p>
    </div>

<form id="contact-form" action="https://docs.google.com/forms/d/e/1FAIpQLSfx-sU3jvD-2AVTs9OxtTDS4RW61oDsr90D9sgQ_CPJQJl56w/formResponse" method="POST">
      
      <div class="form-group">
        <label for="name">お名前<span class="required-badge">必須</span></label>
        <p class="form-help">オープンチャット内でのお名前を記入してください</p>
        <input type="text" id="name" name="name" required placeholder="例：お名前・ニックネーム">
      </div>

      <div class="form-group">
        <label for="email">メールアドレス<span class="required-badge">必須</span></label>
        <p class="form-help">問い合わせの返答にて利用します</p>
        <input type="email" id="email" name="email" required placeholder="例：example@mail.com">
      </div>

      <div class="form-group">
        <label for="subject">件名<span class="required-badge">必須</span></label>
        <input type="text" id="subject" name="subject" required placeholder="例：交通情報の範囲について">
      </div>

      <div class="form-group">
        <label for="message">本文<span class="required-badge">必須</span></label>
        <textarea id="message" name="message" rows="6" required placeholder="お問い合わせ内容を詳しくご記入ください"></textarea>
      </div>

      <div class="form-group">
        <label>利用規約の同意<span class="required-badge">必須</span></label>
        <label class="checkbox-group">
          <input type="checkbox" name="terms" value="同意する" required>
          <span class="checkbox-text"><a href="terms.html" target="_blank">利用規約</a>に同意する</span>
        </label>
      </div>

      <div class="form-group">
        <label>プライバシーポリシーの同意<span class="required-badge">必須</span></label>
        <label class="checkbox-group">
          <input type="checkbox" name="privacy" value="同意する" required>
          <span class="checkbox-text"><a href="privacy.html" target="_blank">プライバシーポリシー</a>に同意する</span>
        </label>
      </div>

      <button type="submit" class="submit-btn" id="submit-button">送信する</button>
    </form>
  </main>

  <footer>
    <div class="footer-links">
      <a href="terms">利用規約</a>
      <a href="privacy">プライバシーポリシー</a>
      <a href="contact">お問い合わせ</a>
    </div>
    <div class="copyright">
      &copy; 2026 地震速報/気象情報/交通情報 共有オープンチャット All Rights Reserved.
    </div>
  </footer>

  <script src="contact.js"></script>

</body>
</html>
